spring:
  application:
    name: emergency-vehicle-alert

  datasource:
    url: jdbc:postgresql://localhost:5432/evas
    username: evas
    password: evas

  jpa:
    hibernate:
      # Flyway owns the schema now (see spring.flyway below and
      # src/main/resources/db/migration/) — Hibernate only validates that
      # our @Entity classes match what Flyway created, it never generates DDL.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

routing:
  # Public demo OSRM server, car profile. We'll switch to a self-hosted
  # instance later if the public one rate-limits us.
  osrm-base-url: https://router.project-osrm.org
