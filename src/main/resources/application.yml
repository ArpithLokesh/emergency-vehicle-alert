spring:
  application:
    name: emergency-vehicle-alert

  datasource:
    url: jdbc:postgresql://localhost:5432/evas
    username: evas
    password: evas

  jpa:
    hibernate:
      # Flyway owns the schema now (see spring.flyway below and
      # src/main/resources/db/migration/) — Hibernate only validates that
      # our @Entity classes match what Flyway created, it never generates DDL.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

routing:
  # Public demo OSRM server, car profile. We'll switch to a self-hosted
  # instance later if the public one rate-limits us — that's a config
  # change here, not a code change (see RoutingProperties).
  osrm-base-url: https://router.project-osrm.org
  profile: driving
  connect-timeout: 5s
  read-timeout: 5s

caching:
  osrm-routes:
    # A route between two fixed points never goes stale, so a long TTL is
    # safe — size-bounded so the cache can't grow unbounded under load.
    maximum-size: 500
    expire-after-write: 24h

tracking:
  # How the backend tracks a vehicle through a trip. See TrackingProperties.
  arrival-threshold-meters: 30      # within this of destination => ARRIVED
  stale-timeout: 45s                # no position for this long => STALE (generous, survives GPS blips)
  stale-check-interval: 15s         # how often the stall watchdog scans
