spring:
  application:
    name: emergency-vehicle-alert

  datasource:
    url: jdbc:postgresql://localhost:5432/evas
    username: evas
    password: evas

  jpa:
    hibernate:
      # Flyway owns the schema now (see spring.flyway below and
      # src/main/resources/db/migration/) — Hibernate only validates that
      # our @Entity classes match what Flyway created, it never generates DDL.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: evas
    password: evas

routing:
  # Public demo OSRM server, car profile. We'll switch to a self-hosted
  # instance later if the public one rate-limits us — that's a config
  # change here, not a code change (see RoutingProperties).
  osrm-base-url: https://router.project-osrm.org
  profile: driving
  connect-timeout: 5s
  read-timeout: 5s

caching:
  osrm-routes:
    # A route between two fixed points never goes stale, so a long TTL is
    # safe — size-bounded so the cache can't grow unbounded under load.
    maximum-size: 500
    expire-after-write: 24h

tracking:
  # How the backend tracks a vehicle through a trip. See TrackingProperties.
  # Two-tier stall handling: STALE is a soft, recoverable pause (vehicle
  # stays ON_TRIP, next position resumes the trip); EXPIRED is the hard,
  # terminal end for a feed that never comes back.
  arrival-threshold-meters: 30      # within this of destination => ARRIVED
  stale-timeout: 120s               # no position for this long => STALE (paused, e.g. a tunnel)
  expire-timeout: 300s              # no position for this long => EXPIRED (terminal, frees vehicle)
  stale-check-interval: 15s         # how often the stall watchdog scans

alerting:
  # How the alerting engine tracks devices ahead of a vehicle and decides
  # when to command them. See AlertingProperties. Hardcoded until MVP-5's
  # policy store; a config change here, never a code change, until then.
  signal-window-size: 3             # how many upcoming signals to track per trip
  lamppost-window-size: 8           # how many upcoming lampposts to track per trip
  signal-trigger-distance-meters: 400  # along-route distance to force-green a signal
  revert-margin-meters: 30          # along-route distance past a device to consider it "passed"
  deviation-threshold-meters: 100   # straight-line distance from route to trigger a re-route
  safety-timeout: 120s              # revert a stuck ACTIVE preemption after this regardless
  sweep-interval: 30s               # how often the safety-timeout sweep scans
  executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100             # beyond this, CallerRunsPolicy backpressures onto ingestion
